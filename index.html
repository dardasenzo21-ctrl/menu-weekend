<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu du week-end</title>
<meta name="description" content="Propose un plat, vote pour ceux des autres.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    --bg: #faf6ee; --card: #fffdf8; --ink: #2a2620; --muted: #6f675b; --line: #e8e0d1;
    --accent: #d2552a; --accent-soft: #fbe6dc; --win: #2f7d4f; --win-soft: #e1f1e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.6 "Atkinson Hyperlegible", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 28px; line-height: 1.25; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .me { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 20px; }
  .me button { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 15px; cursor: pointer; padding: 8px 0; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--line); padding: 4px; border-radius: 14px; margin-bottom: 20px; }
  .tabs button { border: 0; background: none; padding: 12px 8px; border-radius: 11px; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  form.add { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 24px; display: grid; gap: 10px; }
  label { font-weight: 700; font-size: 16px; }
  input { width: 100%; font: inherit; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
  input:focus { outline: none; border-color: var(--accent); }
  .btn { border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 700; padding: 13px 16px; border-radius: 12px; cursor: pointer; }
  .btn:disabled { opacity: .5; }
  ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  li.dish { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
  li.dish.lead { border: 2px solid var(--win); background: var(--win-soft); }
  .badge { grid-column: 1 / -1; font-size: 14px; font-weight: 700; color: var(--win); }
  .name { font-weight: 700; font-size: 20px; line-height: 1.3; }
  .note { color: var(--muted); font-size: 16px; }
  .meta { grid-column: 1 / -1; color: var(--muted); font-size: 15px; }
  .vote { min-width: 72px; border: 2px solid var(--accent); background: var(--card); color: var(--accent); border-radius: 14px; padding: 8px 10px; font: inherit; font-weight: 700; cursor: pointer; display: grid; justify-items: center; line-height: 1.2; }
  .vote span { font-size: 13px; font-weight: 400; }
  .vote[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .rm { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; padding: 4px 0; justify-self: start; }
  .empty { color: var(--muted); text-align: left; padding: 8px 0; }
  .gate { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
  .err { color: var(--accent); font-size: 15px; min-height: 1em; }
  .stats { color: var(--muted); font-size: 15px; margin: -8px 0 16px; }
</style>
</head>
<body>
<main>
  <h1>🍽️ Menu du week-end</h1>
  <p class="sub">Propose ton plat, vote pour ceux qui te tentent (autant que tu veux). Le plus voté gagne.</p>

  <section id="gate" class="gate" hidden>
    <label for="who">Ton prénom</label>
    <input id="who" autocomplete="given-name" maxlength="30" placeholder="ex. Camille">
    <button class="btn" id="go">C’est parti</button>
  </section>

  <section id="app" hidden>
    <div class="me"><span>Salut <b id="meName"></b> 👋</span><button id="change">Changer de prénom</button></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-meal="vendredi" aria-selected="true">🌙 Vendredi soir</button>
      <button role="tab" data-meal="samedi" aria-selected="false">☀️ Samedi midi</button>
    </div>
    <form class="add" id="add">
      <label for="dish">Ton envie pour <span id="mealLabel">vendredi soir</span></label>
      <input id="dish" maxlength="60" placeholder="ex. Raclette, Tacos, Pâtes carbo…" required>
      <input id="note" maxlength="120" placeholder="Précision (facultatif) : végé, sans porc…">
      <button class="btn" id="addBtn">Proposer ce plat</button>
      <div class="err" id="err" role="status"></div>
    </form>
    <p class="stats" id="stats"></p>
    <ol id="list"></ol>
  </section>
</main>
<script>
  // Stockage partagé gratuit sans compte : journal d'événements sur ntfy.sh (cache 12 h),
  // d'où un instantané complet republié toutes les 2 h par le premier téléphone ouvert.
  const TOPIC = 'https://ntfy.sh/menu-we-c31b5bc6a40d1ccc';
  const $ = (s) => document.querySelector(s);
  const LABEL = { vendredi: 'vendredi soir', samedi: 'samedi midi' };
  let me = ''; try { me = localStorage.getItem('menu-who') || ''; } catch {}
  let meal = 'vendredi', dishes = [], msgs = [], seen = new Set(), ready = false;

  function showGate() { $('#gate').hidden = false; $('#app').hidden = true; $('#who').value = me; $('#who').focus(); }
  function showApp() { $('#gate').hidden = true; $('#app').hidden = false; $('#meName').textContent = me; render(); }

  $('#go').onclick = () => {
    const v = $('#who').value.replace(/\s+/g, ' ').trim().slice(0, 30);
    if (!v) return $('#who').focus();
    me = v; try { localStorage.setItem('menu-who', me); } catch {}
    showApp();
  };
  $('#who').onkeydown = (e) => { if (e.key === 'Enter') $('#go').click(); };
  $('#change').onclick = showGate;

  document.querySelectorAll('[role=tab]').forEach((t) => t.onclick = () => {
    meal = t.dataset.meal;
    document.querySelectorAll('[role=tab]').forEach((x) => x.setAttribute('aria-selected', x === t));
    $('#mealLabel').textContent = LABEL[meal];
    render();
  });

  const clean = (v, max) => String(v ?? '').replace(/\s+/g, ' ').trim().slice(0, max);
  const same = (a, b) => a.toLowerCase() === b.toLowerCase();

  function ingest(m) {
    if (m.event !== 'message' || seen.has(m.id)) return false;
    let e; try { e = JSON.parse(m.message); } catch { return false; }
    if (!e || typeof e.k !== 'string') return false;
    seen.add(m.id); msgs.push({ t: m.time, e });
    return true;
  }

  // Chaque événement fixe un état absolu (voté oui/non) : rejouer un événement déjà inclus dans l'instantané est sans effet
  function rebuild() {
    msgs.sort((a, b) => a.t - b.t);
    const parts = {};
    let snap = null;
    for (const { e } of msgs) if (e.k === 'snap' && e.sid) {
      (parts[e.sid] ||= { upto: e.upto, at: e.at, of: e.of, got: {} }).got[e.part] = e.d;
      const p = parts[e.sid];
      if (Object.keys(p.got).length === p.of && (!snap || p.at > snap.at)) snap = p;
    }
    const map = new Map();
    if (snap) for (let i = 0; i < snap.of; i++) for (const [id, ml, name, note, by, ts, votes] of snap.got[i] || [])
      map.set(id, { id, meal: ml, name, note, by, ts, votes: new Set(votes) });
    for (const { t, e } of msgs) {
      if (snap && t < snap.upto) continue;
      const who = clean(e.who, 30);
      if (e.k === 'add' && who && clean(e.name, 60) && LABEL[e.meal] && !map.has(e.id))
        map.set(e.id, { id: e.id, meal: e.meal, name: clean(e.name, 60), note: clean(e.note, 120), by: who, ts: t, votes: new Set([who]) });
      const d = map.get(e.id);
      if (!d || !who) continue;
      if (e.k === 'vote') e.on ? d.votes.add(who) : d.votes.delete(who);
      if (e.k === 'rm' && same(d.by, who)) map.delete(e.id);
    }
    dishes = [...map.values()].map((d) => ({ ...d, votes: [...d.votes] }));
    return snap;
  }

  async function send(e) {
    const r = await fetch(TOPIC, { method: 'POST', body: JSON.stringify(e) });
    if (r.status === 429) throw new Error('Trop de clics d’un coup, réessaie dans quelques secondes');
    if (!r.ok) throw new Error('Ça n’a pas marché, réessaie');
    ingest(await r.json()); rebuild(); render();
  }

  async function snapshotIfStale() {
    const snap = rebuild();
    const now = Date.now() / 1000;
    const oldest = msgs.length ? msgs[0].t : now;
    if (!dishes.length || now - oldest < 7200 || (snap && now - snap.at < 7200)) return;
    const rows = dishes.map((d) => [d.id, d.meal, d.name, d.note, d.by, d.ts, d.votes]);
    const chunks = [[]], te = new TextEncoder();
    for (const r of rows) {
      const c = chunks[chunks.length - 1];
      if (c.length && te.encode(JSON.stringify([...c, r])).length > 3000) chunks.push([r]); else c.push(r);
    }
    const sid = Math.random().toString(36).slice(2, 10), upto = msgs[msgs.length - 1].t;
    for (let i = 0; i < chunks.length; i++)
      await fetch(TOPIC, { method: 'POST', body: JSON.stringify({ k: 'snap', sid, part: i, of: chunks.length, upto, at: Math.floor(now), d: chunks[i] }) }).catch(() => {});
  }

  function live() {
    const last = msgs.length ? 'since=' + Math.max(...msgs.map((m) => m.t)) : 'since=all';
    const es = new EventSource(`${TOPIC}/sse?${last}`);
    es.onmessage = (ev) => { try { if (ingest(JSON.parse(ev.data))) { rebuild(); render(); } } catch {} };
  }

  async function start() {
    try {
      const txt = await (await fetch(`${TOPIC}/json?poll=1&since=all`, { cache: 'no-store' })).text();
      for (const line of txt.split('\n')) if (line) try { ingest(JSON.parse(line)); } catch {}
      ready = true; rebuild(); render(); live();
      setTimeout(snapshotIfStale, Math.random() * 20000);
      setInterval(snapshotIfStale, 600000);
    } catch {
      $('#err').textContent = 'Pas de connexion, recharge la page';
      setTimeout(start, 5000);
    }
  }

  function render() {
    if ($('#app').hidden) return;
    const list = $('#list');
    const mine = dishes.filter((d) => d.meal === meal).sort((a, b) => b.votes.length - a.votes.length || a.ts - b.ts);
    const voters = new Set(mine.flatMap((d) => d.votes));
    $('#stats').textContent = mine.length ? `${mine.length} plat${mine.length > 1 ? 's' : ''} proposé${mine.length > 1 ? 's' : ''} · ${voters.size} personne${voters.size > 1 ? 's ont' : ' a'} voté` : '';
    list.replaceChildren();
    if (!mine.length) { const p = document.createElement('li'); p.className = 'empty'; p.textContent = ready ? 'Aucun plat pour l’instant. Lance-toi !' : 'Chargement…'; list.append(p); return; }
    const top = mine[0].votes.length;
    for (const d of mine) {
      const li = document.createElement('li'); li.className = 'dish';
      if (top > 0 && d.votes.length === top) {
        li.classList.add('lead');
        const b = document.createElement('div'); b.className = 'badge'; b.textContent = '🏆 En tête'; li.append(b);
      }
      const txt = document.createElement('div');
      const n = document.createElement('div'); n.className = 'name'; n.textContent = d.name; txt.append(n);
      if (d.note) { const no = document.createElement('div'); no.className = 'note'; no.textContent = d.note; txt.append(no); }
      li.append(txt);
      const on = d.votes.some((v) => same(v, me));
      const v = document.createElement('button'); v.className = 'vote'; v.setAttribute('aria-pressed', on);
      v.setAttribute('aria-label', `${on ? 'Retirer mon vote pour' : 'Voter pour'} ${d.name}`);
      v.innerHTML = `${on ? '❤️' : '🤍'} ${d.votes.length}<span>${on ? 'voté' : 'voter'}</span>`;
      v.onclick = () => act({ k: 'vote', id: d.id, who: me, on: !on });
      li.append(v);
      const m = document.createElement('div'); m.className = 'meta';
      m.textContent = `Proposé par ${d.by}${d.votes.length ? ' · ' + d.votes.join(', ') : ''}`;
      li.append(m);
      if (same(d.by, me)) {
        const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = 'Retirer mon plat';
        rm.onclick = () => act({ k: 'rm', id: d.id, who: me });
        li.append(rm);
      }
      list.append(li);
    }
  }

  async function act(e) {
    $('#err').textContent = '';
    try { await send(e); } catch (x) { $('#err').textContent = x.message; }
  }

  $('#add').onsubmit = async (ev) => {
    ev.preventDefault();
    const name = clean($('#dish').value, 60); if (!name) return;
    $('#addBtn').disabled = true;
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await act({ k: 'add', id, meal, name, note: clean($('#note').value, 120), who: me });
    if (!$('#err').textContent) { $('#dish').value = ''; $('#note').value = ''; }
    $('#addBtn').disabled = false;
  };

  if (me) showApp(); else showGate();
  start();
</script>
</body>
</html>
