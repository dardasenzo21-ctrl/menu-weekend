[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-buildings"
version = "1.0.0"
description = "Modélisation paramétrique de bâtiments dans Blender, exposée en serveur MCP, API HTTP et CLI (headless)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Offstone / projets perso" }]
dependencies = [
  "pydantic>=2.7",
  "requests>=2.31",
  "pyproj>=3.6",
]

[project.optional-dependencies]
# Le module Python officiel de Blender (rendu + modélisation sans interface). Nécessite Python 3.13 pour bpy 5.2.
bpy = ["bpy==5.2.3"]
mcp = ["mcp>=2.0"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "pillow>=10"]
all = ["blender-buildings[bpy,mcp,api,dev]"]

[project.scripts]
blender-buildings = "blender_buildings.cli:main"
blender-buildings-mcp = "blender_buildings.mcp_server:main"
blender-buildings-api = "blender_buildings.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blender_buildings = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "bpy: tests needing the bpy module (skipped if unavailable)",
]
